events {}

http {

    # HTTP -> HTTPS redirect
    server {

        listen 80;
        server_name researchpaper.site www.researchpaper.site;

        return 301 https://$host$request_uri;
    }

    # HTTPS SERVER
    server {

        listen 443 ssl;
        server_name researchpaper.site www.researchpaper.site;

        ssl_certificate /etc/letsencrypt/live/researchpaper.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/researchpaper.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;



        location = / {
            return 301 /swagger-ui.html;
        }

        location / {

            proxy_pass http://app:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}