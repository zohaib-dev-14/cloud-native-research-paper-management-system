name: Spring Boot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # Step 1 - Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2 - Cache Maven Dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-


      # Step 3 - Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven


      # Step 4 - Give Maven Permission
      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw


      # Step 5 - Run Tests
      - name: Run Tests
        run: ./mvnw test


      # Step 6 - Upload Test Reports if Failed
      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7


      # Step 7 - Build Spring Boot Project
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests


      # Step 8 - Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            --tag research-app:${{ github.sha }} \
            --tag research-app:latest \
            .


      # Step 9 - Scan Docker Image for Vulnerabilities
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: research-app:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH


      # Step 10 - Save Docker Image
      - name: Save Docker Image
        run: docker save research-app:${{ github.sha }} | gzip > research-app.tar.gz


      # Step 11 - Upload Docker Image Artifact
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: research-app.tar.gz
          retention-days: 5